<!DOCTYPE html>
<html>
<body>

<h1>Bottle Sorter</h1>

<button onclick="connectMicrobit()">Connect micro:bit</button>
<button onclick="init()">Start Camera</button>
<button onclick="calibrateBackground()">Calibrate Empty Background</button>
<button onclick="manualSort('BOTTLE')">Test Recycling</button>
<button onclick="manualSort('CHIPS')">Test Rubbish</button>

<div id="status">Status: Not calibrated</div>

<div id="webcam-container"></div>
<div id="label-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>

const URL = "./my_model/";

let model, webcam, labelContainer, maxPredictions;
let port;
let writer;

let detectedClass = "";
let detectionStartTime = 0;
let sortingLocked = false;
let lastDisplayUpdate = 0;
let loopRunning = false;

// AI confidence level
let confidenceThreshold = 0.98;

// Manual background calibration
let backgroundImageData = null;
let backgroundThreshold = 18;
let compareCanvas = document.createElement("canvas");
let compareContext = compareCanvas.getContext("2d");

async function connectMicrobit(){

    port = await navigator.serial.requestPort();

    await port.open({ baudRate: 115200 });

    writer = port.writable.getWriter();

    document.getElementById("status").innerHTML =
        "Status: micro:bit connected.";

}

async function sendToMicrobit(message){

    if(writer){

        const data = new TextEncoder().encode(message + "\n");

        await writer.write(data);

    } else {

        alert("Connect the micro:bit first.");

    }

}

async function manualSort(message){

    if(sortingLocked){
        return;
    }

    sortingLocked = true;

    await sendToMicrobit(message);

    setTimeout(function(){

        sortingLocked = false;
        detectedClass = "";
        detectionStartTime = 0;

    }, 4000);

}

async function init(){

    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);

    maxPredictions = model.getTotalClasses();

    webcam = new tmImage.Webcam(300, 300, true);

    await webcam.setup();
    await webcam.play();

    document.getElementById("webcam-container").innerHTML = "";
    document.getElementById("webcam-container").appendChild(webcam.canvas);

    labelContainer = document.getElementById("label-container");
    labelContainer.innerHTML = "";

    for(let i = 0; i < maxPredictions; i++){

        labelContainer.appendChild(document.createElement("div"));

    }

    document.getElementById("status").innerHTML =
        "Status: Camera started. Point at empty background, then press Calibrate Empty Background.";

    if(!loopRunning){

        loopRunning = true;
        window.requestAnimationFrame(loop);

    }

}

function calibrateBackground(){

    if(!webcam){

        alert("Start the camera first.");
        return;

    }

    compareCanvas.width = webcam.canvas.width;
    compareCanvas.height = webcam.canvas.height;

    compareContext.drawImage(webcam.canvas, 0, 0);

    backgroundImageData =
        compareContext.getImageData(0, 0, compareCanvas.width, compareCanvas.height);

    document.getElementById("status").innerHTML =
        "Status: Empty background calibrated.";

}

function getBackgroundDifference(){

    if(!backgroundImageData || !webcam){
        return 999;
    }

    compareContext.drawImage(webcam.canvas, 0, 0);

    const currentImageData =
        compareContext.getImageData(0, 0, compareCanvas.width, compareCanvas.height);

    const current = currentImageData.data;
    const background = backgroundImageData.data;

    let totalDifference = 0;
    let count = 0;

    // Check every 10th pixel so it runs faster
    for(let i = 0; i < current.length; i += 40){

        const redDifference = Math.abs(current[i] - background[i]);
        const greenDifference = Math.abs(current[i + 1] - background[i + 1]);
        const blueDifference = Math.abs(current[i + 2] - background[i + 2]);

        totalDifference += (redDifference + greenDifference + blueDifference) / 3;
        count++;

    }

    return totalDifference / count;

}

async function loop(){

    if(webcam){

        webcam.update();

        await predict();

    }

    window.requestAnimationFrame(loop);

}

async function predict(){

    if(!model || !webcam || !labelContainer){
        return;
    }

    const prediction = await model.predict(webcam.canvas);
    const now = Date.now();

    if(now - lastDisplayUpdate > 300){

        for(let i = 0; i < maxPredictions; i++){

            labelContainer.childNodes[i].innerHTML =
                prediction[i].className +
                ": " +
                (prediction[i].probability * 100).toFixed(1) +
                "%";

        }

        lastDisplayUpdate = now;

    }

    const bestPrediction = prediction.reduce(
        (best, current) =>
            current.probability > best.probability
                ? current
                : best
    );

    const currentClass =
        bestPrediction.className.trim().toUpperCase();

    const confidence = bestPrediction.probability;

    if(sortingLocked){
        return;
    }

    // Background safety check
    if(backgroundImageData){

        const difference = getBackgroundDifference();

        if(difference < backgroundThreshold){

            document.getElementById("status").innerHTML =
                "Status: Empty background detected. Sorting blocked.";

            detectedClass = "";
            detectionStartTime = 0;
            return;

        } else {

            document.getElementById("status").innerHTML =
                "Status: Object detected. AI sorting active.";

        }

    }

    const recognisedObject =
        currentClass === "PLASTIC BOTTLE" ||
        currentClass === "CHIP PACKET";

    if(confidence < confidenceThreshold || !recognisedObject){

        detectedClass = "";
        detectionStartTime = 0;
        return;

    }

    if(currentClass !== detectedClass){

        detectedClass = currentClass;
        detectionStartTime = now;
        return;

    }

    // Object must stay detected for 1 second
    if(now - detectionStartTime < 1000){
        return;
    }

    sortingLocked = true;

    if(currentClass === "PLASTIC BOTTLE"){

        await sendToMicrobit("BOTTLE");

    } else if(currentClass === "CHIP PACKET"){

        await sendToMicrobit("CHIPS");

    }

    setTimeout(function(){

        sortingLocked = false;
        detectedClass = "";
        detectionStartTime = 0;

    }, 4000);

}

</script>

</body>
</html>
