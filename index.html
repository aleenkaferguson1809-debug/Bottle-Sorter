<!DOCTYPE html>
<html>
<body>

<h1>Bottle Sorter</h1>

<button onclick="connectMicrobit()">Connect micro:bit</button>

<button onclick="init()">Start Camera</button>

<button onclick="sendToMicrobit('BOTTLE')">Test Recycling</button>

<button onclick="sendToMicrobit('CHIPS')">Test Rubbish</button>

<div id="webcam-container"></div>
<div id="label-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>

const URL="./my_model/";

let model, webcam, labelContainer, maxPredictions;
let port;
let writer;
let detectedClass = "";
let detectionStartTime = 0;
let sortingLocked = false;
let lastDisplayUpdate = 0;

async function connectMicrobit(){

port = await navigator.serial.requestPort();

await port.open({ baudRate:115200 });

writer = port.writable.getWriter();

}

async function sendToMicrobit(message){

if(writer){

const data=
new TextEncoder().encode(message+"\n");

await writer.write(data);

}

}
async function init(){

const modelURL=URL+"model.json";
const metadataURL=URL+"metadata.json";

model=await tmImage.load(modelURL,metadataURL);

maxPredictions=model.getTotalClasses();

webcam=new tmImage.Webcam(300,300,true);

await webcam.setup();
await webcam.play();

window.requestAnimationFrame(loop);

document
.getElementById("webcam-container")
.appendChild(webcam.canvas);

labelContainer=
document.getElementById("label-container");

for(let i=0;i<maxPredictions;i++){

labelContainer.appendChild(
document.createElement("div")
);

}

}

async function loop(){

webcam.update();

await predict();

window.requestAnimationFrame(loop);

}

async function predict(){

    const prediction = await model.predict(webcam.canvas);
    const now = Date.now();

    // Slow the percentage display so it is easier to read
    if(now - lastDisplayUpdate > 300){

        for(let i = 0; i < maxPredictions; i++){

            labelContainer.childNodes[i].innerHTML =
                prediction[i].className +
                ": " +
                (prediction[i].probability * 100).toFixed(1) +
                "%";
        }

        lastDisplayUpdate = now;
    }

    // Find the class with the highest percentage
    const bestPrediction = prediction.reduce(
        (best, current) =>
            current.probability > best.probability
                ? current
                : best
    );

    // Remove extra spaces and ignore capitalisation
    const currentClass =
        bestPrediction.className.trim().toUpperCase();

    const confidence = bestPrediction.probability;

    // Do nothing while the servo is already sorting
    if(sortingLocked){
        return;
    }

    // Only accept recognised objects above 90%
    const recognisedObject =
        currentClass === "PLASTIC BOTTLE" ||
        currentClass === "CHIP PACKET";

    if(confidence < 0.90 || !recognisedObject){

        detectedClass = "";
        detectionStartTime = 0;
        return;
    }

    // Begin timing a new detection
    if(currentClass !== detectedClass){

        detectedClass = currentClass;
        detectionStartTime = now;
        return;
    }

    // The same object must remain above 90% for one second
    if(now - detectionStartTime < 1000){
        return;
    }

    sortingLocked = true;

    if(currentClass === "PLASTIC BOTTLE"){

        await sendToMicrobit("BOTTLE");

    } else if(currentClass === "CHIP PACKET"){

        await sendToMicrobit("CHIPS");
    }

    // Wait before allowing another sorting action
    setTimeout(function(){

        sortingLocked = false;
        detectedClass = "";
        detectionStartTime = 0;

    }, 4000);
}

const prediction=
await model.predict(webcam.canvas);

for(let i=0;i<maxPredictions;i++){

labelContainer.childNodes[i].innerHTML=
prediction[i].className+
": "+
(prediction[i].probability*100).toFixed(1)+"%";

}

// Plastic bottle detected
if(
prediction[0].className=="Plastic Bottle"
&&
prediction[0].probability>.85
){

sendToMicrobit("BOTTLE");

}

// Chip packet detected
if(
prediction[1].className=="Chip Packet"
&&
prediction[1].probability>.85
){

sendToMicrobit("CHIPS");

}

}

</script>

</body>
</html>
