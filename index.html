<!DOCTYPE html>
<html>
<body>

<h1>Bottle Sorter</h1>

<button onclick="connectMicrobit()">Connect micro:bit</button>

<button onclick="init()">Start Camera</button>

<button onclick="sendToMicrobit('BOTTLE')">Test Recycling</button>

<button onclick="sendToMicrobit('CHIPS')">Test Rubbish</button>

<div id="webcam-container"></div>
<div id="label-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>

const URL="./my_model/";

let model, webcam, labelContainer, maxPredictions;
let port;
let writer;

async function connectMicrobit(){

port = await navigator.serial.requestPort();

await port.open({ baudRate:115200 });

writer = port.writable.getWriter();

}

async function sendToMicrobit(message){

if(writer){

const data=
new TextEncoder().encode(message+"\n");

await writer.write(data);

}

}
async function init(){

const modelURL=URL+"model.json";
const metadataURL=URL+"metadata.json";

model=await tmImage.load(modelURL,metadataURL);

maxPredictions=model.getTotalClasses();

webcam=new tmImage.Webcam(300,300,true);

await webcam.setup();
await webcam.play();

window.requestAnimationFrame(loop);

document
.getElementById("webcam-container")
.appendChild(webcam.canvas);

labelContainer=
document.getElementById("label-container");

for(let i=0;i<maxPredictions;i++){

labelContainer.appendChild(
document.createElement("div")
);

}

}

async function loop(){

webcam.update();

await predict();

window.requestAnimationFrame(loop);

}

async function predict(){

const prediction=
await model.predict(webcam.canvas);

for(let i=0;i<maxPredictions;i++){

labelContainer.childNodes[i].innerHTML=
prediction[i].className+
": "+
(prediction[i].probability*100).toFixed(1)+"%";

}

// Plastic bottle detected
if(
prediction[0].className=="Plastic Bottle"
&&
prediction[0].probability>.85
){

sendToMicrobit("BOTTLE");

}

// Chip packet detected
if(
prediction[1].className=="Chip Packet"
&&
prediction[1].probability>.85
){

sendToMicrobit("CHIPS");

}

}

</script>

</body>
</html>
